[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mark-converter"
version = "0.1.0"
description = "Markdown Viewer & Converter built with GTK4 and libadwaita"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "PyGObject>=3.50",
  "markdown2html5-base>=1.0.0",
  "chromium",
]

[project.scripts]
mark-converter = "mark_converter.main:main"

[tool.setuptools.packages.find]
include = ["mark_converter*"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["venv", "AppDir"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "D",    # pydocstyle (docstrings)
]
ignore = [
    "BLE001",  # intentional: robust config-file handling
    "S110",    # intentional: silent best-effort reads/writes
    "E402",    # required GTK idiom: gi.require_version() precedes imports
]

[tool.ruff.lint.per-file-ignores]
"test_converter.py" = [
    "BLE001",
    "S110",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "venv|AppDir"
